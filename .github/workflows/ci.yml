name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the full history to compute the version.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test extras
        run: pip install -e ".[test]"
      # pytest-cov breaks the jaxlib MLIR import; run coverage around pytest.
      - name: Run tests
        run: |
          coverage run -m pytest
          coverage report --show-missing
      # A few cells of every benchmark suite, so the wrappers cannot rot
      # between the manual sweeps. One Python version is enough: this checks
      # that the code still runs, not how fast it is.
      - name: Benchmark smoke
        if: matrix.python-version == '3.11'
        run: |
          python examples/benchmark/run_studies.py --smoke --suite all             --output benchmark_smoke
